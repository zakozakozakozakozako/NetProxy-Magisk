name: Build NetProxy Android Manager

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/android/**'
  pull_request:
    paths:
      - 'src/android/**'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/android

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-37.0 build-tools;37.0.0'

      - name: Cache Gradle
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('src/android/**/*.gradle*', 'src/android/gradle/libs.versions.toml') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Test, lint & assemble debug
        run: ./gradlew testDebugUnitTest lintDebug assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v6
        with:
          name: netproxy-debug-apk
          path: src/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error